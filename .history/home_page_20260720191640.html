<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム画面</title>
    <link href="css/home_page.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif+JP:wght@200..900&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">

</head>
<body>
    <div class="header-wrap">
        <p class="ge-ji zen-maru-gothic-regular">ゲージが溜まると何かが変わるかも？</p>
        <section class="images-wrap-1">
            <img src="images/Ellipse 17.png" alt="黄色の丸">
            <img src="images/heart.png" alt="ハート">
        </section>
        <section class="images-wrap-2">
            <img src="images/Rectangle 5.png" alt="白">
            <img src="images/Vector 1.png" alt="黄色">
        </section>
    </div>

    <div class="word-wrap">
        <img src="images/speech_bubble.png" alt="セリフ">
        <p class="time zen-maru-gothic-regular" >薬の時間だよ。</p>
    </div>

    <img src="images/big_sowan.png" alt="ソワンちゃん">
    <p class="name zen-maru-gothic-regular">みさき</p>

    <div class="continue-wrap">
        <img src="images/Vector.png" alt="炎">
        <p class="continue zen-maru-gothic-regular">3日<br>連続</p>
    </div>

    <div class="did-wrap">
        <img src="images/kira.png" alt="ダイヤモンド">
        <p class="did zen-maru-gothic-regular">60回<br>やった回数</p>
    </div>
</body>
</html>
