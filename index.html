<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム画面</title>
    <link rel="stylesheet" href="css/ress.css">
    <link href="css/index.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif+JP:wght@200..900&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">

</head>
<body>

    <div class="header-wrap">
        <p class="ge-ji zen-maru-gothic-regular">ゲージが溜まると何かが変わるかも？</p>
        <section class="images-wrap-1">
            <img class="white" src="images/Ellipse 17.png" alt="黄色の丸">
            <img class="heart" src="images/heart.png" alt="ハート">
        </section>
        <section class="images-wrap-2">
            <img class="white-1" src="images/Rectangle 5.png" alt="白">

            <div class="gauge-info">
                <span class="zen-maru-gothic-regular" id="gaugeCount">0/</span>
                <span class=" zen-maru-gothic-regular">3</span>
            </div>
            <p class="level zen-maru-gothic-regular" id="levelText">
                LEVEL1
            </p>
            <img class="yellow" src="images/Vector 1.png" alt="黄色">
        </section>
    </div>

    <div class="word-wrap">
        <img src="images/speech_bubble.png" alt="セリフ">
        <p class="time zen-maru-gothic-regular" >薬の時間だよ。</p>
    </div>

    <img class="img" id="character" src="images/big_sowan.png" alt="ソワンちゃん">
    <p class="name zen-maru-gothic-regular">みさき</p>

    <div class="continue-wrap">
        <img src="images/Vector.png" alt="炎">
        <p class="continue zen-maru-gothic-regular">
            <span id="streak">0</span>回<br>
            連続</p>
    </div>

    <div class="did-wrap">
        <img src="images/kira.png" alt="ダイヤモンド">
        <p class="did zen-maru-gothic-regular">
            <span id="totalCount">0</span>回<br>やった回数</p>
    </div>

    <div class="record-wrap">
        <a href="record.html" id="recordButton">
            <img src="images/smile.png" alt="笑顔">
            <p class="today-record zen-maru-gothic-regular">今日やったことを記録しよう！</p>
        </a>
    </div>

    <!-- <div class="clear-modal" id="clearModal">
        <div class="clear-content">
            <div class="confetti">🎉</div>
            <h2 class="zen-maru-gothic-regular">おめでとう！</h2>
            <p id="clearMessage" class="zen-maru-gothic-regular">ゲージがいっぱいになったよ！</p>
            <img id="changeCharacter" src="images/chenge_sowann.png" alt="変化したソワンちゃん">
            <p class="change-text" id="changeText">ソワンちゃんに変化があったよ！</p>
            <button id="closeModal">やった！</button>
        </div>
    </div> -->


    <div class="footer-wrap">
        <div class="home">
            <a href="index.html">
                <img src="images/home.png" alt="ホーム">
                <p class="word zen-maru-gothic-regular">ホーム</p>
            </a>
        </div>
        <div class="record">
            <a href="record.html">
                <img src="images/record.png" alt="記録">
                <p class="word zen-maru-gothic-regular">記録</p>
            </a>
        </div>
        <div class="setting">
            <a href="setting.html">
                <img src="images/setting.png" alt="設定">
                <p class="word zen-maru-gothic-regular">設定</p>
            </a>
        </div>
    </div>



<script src="javascript/index.js"></script>
<script src="javascript/home.js"></script>
</body>
</html>
