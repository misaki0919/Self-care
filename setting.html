<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定画面</title>
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/setting.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif+JP:wght@200..900&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
</head>
<body>
<body>
    

    <p class="heading zen-maru-gothic-regular">設定</p>

    <div class="setting-box">
        <div class="setting-item">
            <img src="images/name.png" alt="">
            <p class="zen-maru-gothic-regular">名前変更</p>
        </div>
        <div class="setting-item">
            <img src="images/smile2.png" alt="">
            <p class="zen-maru-gothic-regular">キャラクター変更</p>
        </div>
        <div class="setting-item">
            <img src="images/repeat.png" alt="">
            <p class="zen-maru-gothic-regular">通知の間隔</p>
            <span class="zen-maru-gothic-regular">20分</span>
        </div>
        <div class="setting-item">
            <img src="images/bell.png" alt="">
            <p class="zen-maru-gothic-regular">削除前にアラートを表示</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <img src="images/viv.png" alt="">
            <p class="zen-maru-gothic-regular">振動</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
    </div>


    <p class="heading zen-maru-gothic-regular">サポート</p>

    <div class="setting-box">
        <div class="setting-item">
            <img src="images/mail.png">
            <p class="zen-maru-gothic-regular">お問い合わせ</p>
            <img class="arrow" src="images/next.png">
        </div>
        <div class="setting-item">
            <img src="images/nav.png">
            <p class="zen-maru-gothic-regular">バグ報告・意見やご要望</p>
            <img class="arrow" src="images/next.png">
        </div>
        <div class="setting-item">
            <img src="images/star.png">
            <p class="zen-maru-gothic-regular">レビューを書く</p>
            <img class="arrow" src="images/next.png">
        </div>
    </div>





    <p class="heading zen-maru-gothic-regular">このアプリについて</p>

    <div class="setting-box">
        <div class="setting-item">
            <img src="images/symbol.png">
            <p class="zen-maru-gothic-regular">プレミアムプラン</p>
            <img class="arrow" src="images/next.png">
        </div>
        <div class="setting-item">
            <img src="images/hands.png">
            <p class="zen-maru-gothic-regular">プライバシーポリシー</p>
            <img class="arrow" src="images/next.png">
        </div>
        <div class="setting-item">
            <img src="images/ver.png">
            <p class="zen-maru-gothic-regular">バージョン</p>
            <span class="zen-maru-gothic-regular">1.0.5</span>
        </div>
    </div>


    <div class="footer-wrap">
        <div class="home">
            <a href="index.html">
                <img src="images/home.png" alt="ホーム">
                <p class="word zen-maru-gothic-regular">ホーム</p>
            </a>
        </div>
        <div class="record">
            <a href="record.html">
                <img src="images/record.png" alt="記録">
                <p class="word zen-maru-gothic-regular">記録</p>
            </a>
        </div>
        <div class="setting">
            <a href="setting.html">
                <img src="images/setting.png" alt="設定">
                <p class="word zen-maru-gothic-regular">設定</p>
            </a>
        </div>
    </div>

</body>
</html>
