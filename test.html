<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            border: solid 1px tomato;
            height: 80px;
            width: 80px;
            position: relative;
        }
        .wrap::before{
            content: "";
            height: 20px;
            width: 20px;
            border-radius: 100%;
            position: absolute;
            right: -10px;
            top: -10px;
            background-color: tomato;
            display: block;
            border: solid 1px rgb(112, 29, 139);
        }
    </style>
</head>
<body>
    <div class="wrap">

        wrap

    </div>
</body>
</html>
