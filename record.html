<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記録画面</title>
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/record.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif+JP:wght@200..900&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <div class="do-wrap">
        <p class="do zen-maru-gothic-regular">やってみよう！</p>
        <img id="deleteBtn" src="images/trash.png" alt="ゴミ箱">
        <img id="addBtn" src="images/add.png" alt="追加">
    </div>

    <div class="record-wrap">
        <img src="images/mugic.png" alt="音楽">
        <p class="word zen-maru-gothic-regular">好きな音楽を聴く</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/open-mouth.png" alt="深呼吸">
        <p class="word zen-maru-gothic-regular">深呼吸する</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/talk.png" alt="話す">
        <p class="word zen-maru-gothic-regular">気持ちを誰かに話す</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/bath.png" alt="お風呂">
        <p class="word zen-maru-gothic-regular">ゆっくりお風呂に入る</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/sweet.png" alt="スイーツ">
        <p class="word zen-maru-gothic-regular">甘いもの食べる</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/sleep.png" alt="寝る">
        <p class="word zen-maru-gothic-regular">十分な睡眠をとる</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/diary.png" alt="日記">
        <p class="word zen-maru-gothic-regular">日記を書く</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/drink.png" alt="飲み物">
        <p class="word zen-maru-gothic-regular">水分補給をする</p>
        <div class="circle"></div>
    </div>

    <div class="record-wrap">
        <img src="images/mugic.png" alt="音楽">
        <p class="word zen-maru-gothic-regular">音楽を聴く</p>
        <div class="circle"></div>
    </div>

        <div class="footer-wrap">
        <div class="home">
            <a href="index.html">
                <img src="images/home.png" alt="ホーム">
                <p class="word zen-maru-gothic-regular">ホーム</p>
            </a>
        </div>
        <div class="record">
            <a href="record.html">
                <img src="images/record.png" alt="記録">
                <p class="word zen-maru-gothic-regular">記録</p>
            </a>
        </div>
        <div class="setting">
            <a href="setting.html">
                <img src="images/setting.png" alt="設定">
                <p class="word zen-maru-gothic-regular">設定</p>
            </a>
        </div>
    </div>
    <div id="modal" class="modal">
    <div class="modal-content">
        <p class="zen-maru-gothic-regular">削除してもよろしいですか？</p>
        <div class="modal-btn">
            <button class="zen-maru-gothic-regular" id="okBtn">はい</button>
            <button class="zen-maru-gothic-regular" id="cancelBtn">いいえ</button>
        </div>
    </div>
</div>


<div id="sheetBg" class="sheet-bg"></div>

<div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-bar"></div>
    <h2 class="sheet-title zen-maru-gothic-regular">
        どんな項目を追加する？
    </h2>
    <input
        type="text"
        id="newTask"
        class="sheet-input zen-maru-gothic-regular"
        placeholder="例：散歩する">
    <div class="sheet-button">
        <button class="zen-maru-gothic-regular" id="addTaskBtn">追加する</button>
    </div>
</div>

<script src="javascript/record.js"></script>
</body>
</html>
